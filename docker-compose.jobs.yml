# Job scheduler only — connects to PostgreSQL via DATABASE_URL (no DB service here).
# Usage: docker compose -f docker-compose.jobs.yml up --build

services:
  job-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile.jobs
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment or .env}
    restart: unless-stopped
